<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c1c1c">
<title>同花顺 · 模拟盘</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#1c1c1c;--card:#272727;--card2:#2b2b2b;--line:#333;--line2:#2c2c2c;
  --txt:#e9e9e9;--txt2:#c3c6ca;--sub:#a8acb1;--dim:#6b7075;
  --red:#fd4432;--green:#01b35d;--flat:#8b8f94;
  --tab:#171717;--top:#1c1c1c;--ovl:rgba(26,26,26,.78);
  --btn2:#2d2d2d;--btn2t:#d5d8db;--kb:#313131;--kbt:#e9e9e9;
  --sheet:#262626;--tipbg:#2a2418;--tipbd:#3d3320;--tiptx:#c9ab6f;--tipb:#e0b054;
  --rg:#8a5230;--rgc:#d98a4a;--idxup:#2e1d20;--idxdn:#17281e;
}
body[data-theme="light"]{
  --bg:#f2f3f5;--card:#fff;--card2:#f7f8fa;--line:#ebedf0;--line2:#f0f1f3;
  --txt:#1a1c1f;--txt2:#3d4249;--sub:#8a8f96;--dim:#a6abb2;
  --red:#e33b30;--green:#00a05a;--flat:#9aa0a8;
  --tab:#fff;--top:#fff;--ovl:rgba(255,255,255,.84);
  --btn2:#f2f3f5;--btn2t:#3d4249;--kb:#f4f5f7;--kbt:#1a1c1f;
  --sheet:#fff;--tipbg:#fff8ec;--tipbd:#ffe6bd;--tiptx:#8a6a2f;--tipb:#c07a10;
  --rg:#c0752f;--rgc:#b06420;--idxup:#fbe6e4;--idxdn:#e2f3ea;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;-webkit-font-smoothing:antialiased;transition:background .18s,color .18s}
body{overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--bg)}
/* ---------- top ---------- */
#top{flex:0 0 auto;display:flex;align-items:center;gap:9px;background:var(--top);
  padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px}
#top .ttl{font-size:16.5px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
#top .back{font-size:22px;line-height:1;padding:0 2px 2px 0;color:var(--txt);font-weight:300}
#top .search{flex:1;min-width:0;background:var(--card2);border-radius:15px;height:29px;display:flex;
  align-items:center;padding:0 11px;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden}
#top .btn{width:26px;height:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  color:var(--sub);font-size:16px;background:none;border:none;border-radius:0;padding:0}
#top .ai{width:25px;height:25px;border-radius:50%;background:linear-gradient(135deg,#6f9bff,#3358ea);
  color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
/* ---------- view ---------- */
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:6px}
#view.in-stock{padding-bottom:66px}
.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--flat)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hide{display:none!important}
/* ---------- 指数卡 ---------- */
.idxrow{display:flex;gap:6px;overflow-x:auto;padding:4px 10px 8px;scrollbar-width:none}
.idxrow::-webkit-scrollbar{display:none}
.idx{flex:0 0 auto;width:calc((100% - 12px)/3);border-radius:6px;padding:8px 9px 9px;background:var(--card)}
.idx.upbg{background:var(--idxup)}
.idx.dnbg{background:var(--idxdn)}
.idx .n{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx .p{font-size:17px;font-weight:600;margin-top:4px;letter-spacing:-.4px}
.idx .c{font-size:11px;margin-top:2px;opacity:.95}
/* ---------- 涨跌家数 ---------- */
.udbar{padding:0 12px 8px}
.udbar .t{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.udbar .bar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--card2)}
.udbar .bar i{display:block;height:100%}
.udbar .bar i.g{background:var(--green)}
.udbar .bar i.r{background:var(--red)}
.sumrow{display:flex;justify-content:space-between;align-items:center;margin:0 10px 8px;padding:9px 11px;
  background:var(--card);border-radius:6px;font-size:12px;color:var(--sub)}
.sumrow b{color:var(--txt);font-weight:600}
/* ---------- 点评卡 ---------- */
.cmt{margin:0 10px 8px;background:var(--card);border-radius:6px;padding:10px 11px}
.cmt .h{display:flex;align-items:center;font-size:13.5px;font-weight:600;color:var(--txt)}
.cmt .h .d{font-size:11px;color:var(--dim);font-weight:400;margin-left:7px}
.cmt .h .ar{margin-left:auto;color:var(--dim);font-size:12px;font-weight:400}
.cmt .b{margin-top:7px;font-size:12.5px;line-height:1.7;color:var(--txt2)}
/* ---------- 功能入口 ---------- */
.frow{display:flex;margin:0 10px 8px;background:var(--card);border-radius:6px;padding:12px 0}
.frow .it{flex:1;text-align:center;font-size:11px;color:var(--txt2)}
.frow .it .ico{width:33px;height:33px;border-radius:9px;margin:0 auto 6px;display:flex;align-items:center;
  justify-content:center;font-size:15px;font-weight:600;color:#fff}
.stat3{display:flex;gap:6px;margin:0 10px 8px}
.stat3 .s{flex:1;background:var(--card);border-radius:6px;padding:9px 10px}
.stat3 .s .k{font-size:11px;color:var(--dim)}
.stat3 .s .v{font-size:15px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
/* ---------- 分段tab ---------- */
.segs{display:flex;padding:4px 12px 2px;gap:18px}
.seg{font-size:14px;color:var(--sub);padding:6px 0;position:relative}
.seg.on{color:var(--txt);font-weight:600}
.seg.on:after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:1px;width:18px;height:2px;
  background:var(--red);border-radius:1px}
/* ---------- 表格 ---------- */
.tbwrap{margin:2px 10px 8px;background:var(--card);border-radius:6px;overflow:hidden}
.tb .th,.tb .tr{display:flex;align-items:center;padding:0 11px}
.tb .th{height:34px;font-size:11.5px;color:var(--dim);border-bottom:1px solid var(--line)}
.tb .tr{height:52px;border-bottom:1px solid var(--line2)}
.tb .tr:last-child{border-bottom:none}
.tb .tr:active{background:var(--card2)}
.tb .c1{flex:1;min-width:0}
.tb .c2,.tb .c3,.tb .c4{width:70px;text-align:right;flex:0 0 auto}
.tb .th .c2,.tb .th .c3,.tb .th .c4{text-align:right}
.tb .nm{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.tb .cd{font-size:10.5px;color:var(--dim);margin-top:3px;display:flex;align-items:center;gap:4px}
.tb .tr .c2{font-size:15px;font-weight:600}
.tb .tr .c3,.tb .tr .c4{font-size:13.5px}
.rg{font-size:9px;line-height:1.35;border:1px solid var(--rg);color:var(--rgc);border-radius:2px;padding:0 2px;display:inline-block}
.addrow{margin:0 10px 12px;height:42px;border-radius:6px;background:var(--card2);color:var(--sub);
  display:flex;align-items:center;justify-content:center;font-size:13.5px}
/* ---------- 自选页顶部 ---------- */
.wtop{display:flex;align-items:flex-start;padding:6px 12px 8px}
.wtop .wlab{font-size:11px;color:var(--sub);margin-bottom:6px}
.wtop .big{font-size:27px;font-weight:700;letter-spacing:-.6px;line-height:1}
.wtop .wsub{font-size:12px;margin-top:7px}
.wtop .ics{display:flex;gap:15px;margin-left:auto}
.wtop .ics .it{text-align:center;font-size:10.5px;color:var(--sub)}
.wtop .ics .it .ico{width:31px;height:31px;border-radius:50%;background:var(--card2);color:var(--sub);
  display:flex;align-items:center;justify-content:center;margin:0 auto 4px;font-size:14px}
/* ---------- 个股页 ---------- */
.shead{padding:6px 12px 0}
.srow1{display:flex;align-items:center;gap:6px}
.srow1 .snm{font-size:17px;font-weight:600}
.srow1 .scd{font-size:11.5px;color:var(--dim)}
.srow1 .tag{font-size:9px;line-height:1.5;border:1px solid var(--rg);color:var(--rgc);border-radius:2px;padding:0 2px}
.srow1 .starm{margin-left:auto;font-size:17px;color:var(--dim)}
.srow1 .starm.on{color:#f5a623}
.srow2{display:flex;align-items:flex-start;gap:10px;margin-top:6px}
.sprice{flex:0 0 auto;min-width:104px}
.sprice .big{font-size:32px;font-weight:700;line-height:1;letter-spacing:-1px}
.sprice .chg{font-size:12.5px;margin-top:6px}
.sgrid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);gap:5px 5px;font-size:10.5px;color:var(--dim)}
.sgrid div{display:flex;gap:3px;justify-content:space-between;white-space:nowrap;overflow:hidden}
.sgrid b{color:var(--txt2);font-weight:600;font-size:10.5px}
.chartbox{margin:8px 10px 0;background:var(--card);border-radius:6px;padding:7px 6px 4px;position:relative}
.chartbox canvas{width:100%;display:block}
.ptabs{display:flex;align-items:center;gap:15px;padding:2px 8px 5px;font-size:13px;color:var(--sub)}
.ptabs .pt.on{color:var(--txt);font-weight:600;position:relative}
.ptabs .pt.on:after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:-4px;width:16px;height:2px;
  background:var(--red);border-radius:1px}
.chartwrap{position:relative}
.bookov{position:absolute;right:0;top:22px;width:116px;background:var(--ovl);border-radius:3px;
  padding:2px 4px 3px;font-size:10px;line-height:14.5px;color:var(--sub)}
.bookov .r{display:flex;align-items:center}
.bookov .r .l{width:24px;flex:0 0 auto;color:var(--dim)}
.bookov .r .p{flex:1;text-align:right;font-weight:600}
.bookov .r .v{width:32px;flex:0 0 auto;text-align:right;color:var(--dim);font-size:9.5px;overflow:hidden}
.bookov .h{display:flex;font-size:9.5px;color:var(--dim);padding-bottom:1px}
.bookov .h span{flex:1;text-align:right}
.sact{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--bg);border-top:1px solid var(--line2);margin-top:6px}
.sact .l{flex:1;min-width:0;font-size:12px;color:var(--sub);overflow:hidden;white-space:nowrap}
.sact .btn{flex:0 0 92px;height:38px;font-size:14px}
.book{padding:0 10px}
.bkr{padding:2px 12px 8px}
.bkr .br-row{display:flex;align-items:center;height:27px;font-size:12px;color:var(--sub)}
.bkr .br-row span:first-child{width:34px;flex:0 0 auto;color:var(--dim)}
.bkr .br-row b{flex:1;text-align:right;color:var(--txt2);font-weight:600;font-size:12.5px}
.bkr .br-row .q{width:60px;flex:0 0 auto;text-align:right;color:var(--dim);font-size:11px}
/* ---------- 交易页 ---------- */
.tnav{display:flex;padding:0 4px;border-bottom:1px solid var(--line2);margin-bottom:2px}
.tnav .it{padding:11px 13px;font-size:14.5px;color:var(--sub);position:relative;white-space:nowrap}
.tnav .it.on{color:var(--red);font-weight:600}
.tnav .it.on:after{content:'';position:absolute;left:13px;right:13px;bottom:0;height:2px;background:var(--red)}
.tgrid{display:flex;gap:7px;padding:8px 10px 0}
.tleft{flex:1;min-width:0}
.tright{width:104px;flex:0 0 auto;padding-top:1px}
.ofld{height:42px;border:1px solid var(--red);border-radius:3px;display:flex;align-items:center;
  margin-bottom:7px;background:var(--card2)}
.ofld .pm{width:31px;text-align:center;font-size:17px;color:var(--sub);line-height:1}
.ofld input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--txt);
  font-size:15px;text-align:center;font-variant-numeric:tabular-nums}
.ofld input::placeholder{color:var(--dim);font-size:12.5px}
.ofld .pk{width:26px;text-align:center;font-size:11px;color:var(--sub)}
.miniline{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:1px 2px 8px}
.miniline #est{color:var(--sub)}
.qbtns{display:flex;gap:5px;margin-bottom:9px}
.qbtns .q{flex:1;height:27px;border-radius:3px;background:var(--card2);color:var(--txt2);font-size:11.5px;
  display:flex;align-items:center;justify-content:center}
.qbtns .q:active{background:var(--line)}
.bigbtn{height:45px;border-radius:4px;background:var(--red);color:#fff;font-size:16px;font-weight:600;
  display:flex;align-items:center;justify-content:center;letter-spacing:.5px}
.bigbtn.g{background:var(--green)}
.bigbtn:active{opacity:.86}
.book5{padding-top:3px}
.book5 .r{display:flex;align-items:center;height:27.5px;font-size:11.5px;color:var(--sub)}
.book5 .r span:nth-child(1){width:26px;color:var(--dim);flex:0 0 auto}
.book5 .r span:nth-child(2){flex:1;text-align:right;font-weight:600;margin-right:7px}
.book5 .r .dim{width:24px;flex:0 0 auto;text-align:right;color:var(--dim);font-size:10px}
/* ---------- 资金页 ---------- */
.mtop{display:flex;align-items:center;gap:9px;padding:14px 12px 10px}
.avt{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ffa63d,#ef7d1a);color:#fff;
  font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.mtop .nm{font-size:15px;font-weight:600}
.mtop .ac{font-size:11px;color:var(--dim);margin-top:3px}
.mtop .sw{margin-left:auto;font-size:11.5px;color:var(--sub);white-space:nowrap;flex:0 0 auto}
.mnum{display:flex;gap:10px;padding:0 12px}
.mnum .b{flex:1;min-width:0}
.mnum .lb{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px}
.mnum .vv{font-size:21px;font-weight:700;margin-top:4px;letter-spacing:-.5px}
.mnum .tag{font-size:9.5px;color:var(--sub);border:1px solid var(--line);border-radius:2px;padding:0 3px;line-height:1.5}
.actrow{display:flex;background:var(--card);margin:13px 10px 8px;border-radius:6px;padding:12px 0}
.actrow .it{flex:1;text-align:center;font-size:11px;color:var(--txt2)}
.actrow .it .ico{width:34px;height:34px;border-radius:50%;background:var(--card2);margin:0 auto 6px;
  display:flex;align-items:center;justify-content:center;font-size:13.5px;color:var(--txt2)}
/* ---------- 通用 ---------- */
.card{background:var(--card);border-radius:6px;margin:8px 10px;overflow:hidden}
.card-h{display:flex;align-items:center;padding:10px 11px 6px;font-size:13px;color:var(--sub)}
.card-h .sp{flex:1}
.kv{display:flex;justify-content:space-between;gap:10px;padding:11px;border-bottom:1px solid var(--line2);font-size:13.5px;color:var(--txt2)}
.kv:last-child{border-bottom:none}
.kv .v{color:var(--sub);font-variant-numeric:tabular-nums;text-align:right}
.btnbar{display:flex;gap:9px;padding:9px 10px}
.btn{flex:1;height:42px;border-radius:4px;border:none;font-size:15px;font-weight:600;color:#fff;background:var(--red)}
.btn.g{background:var(--green)}
.btn.o{background:var(--btn2);color:var(--btn2t);border:1px solid var(--line)}
.btn:active{opacity:.85}
.tip{margin:8px 10px;background:var(--tipbg);border:1px solid var(--tipbd);border-radius:6px;padding:10px 11px;
  font-size:12px;line-height:1.7;color:var(--tiptx)}
.tip b{color:var(--tipb)}
.empty{text-align:center;color:var(--dim);font-size:13px;padding:32px 20px}
.pill{font-size:9.5px;padding:0 4px;border-radius:2px;background:var(--card2);color:var(--txt2);margin-left:5px}
/* ---------- 弹层 ---------- */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50}
#mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--sheet);color:var(--txt);
  border-radius:14px 14px 0 0;z-index:60;transform:translateY(110%);transition:transform .25s ease;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:translateY(0)}
.sheet-h{display:flex;align-items:center;padding:14px 16px 8px;font-size:15.5px;font-weight:600}
.sheet-h .x{margin-left:auto;color:var(--dim);font-size:20px;font-weight:400;padding:0 6px}
.sheet-b{padding:0 16px 16px;max-height:70vh;overflow-y:auto}
.amt{font-size:32px;font-weight:700;text-align:center;padding:12px 0 4px;font-variant-numeric:tabular-nums}
.amt small{font-size:15px;color:var(--dim);font-weight:400;margin-right:3px}
.pwd-dots{display:flex;justify-content:center;gap:12px;padding:14px 0}
.pwd-dots i{width:36px;height:42px;border-bottom:1.5px solid var(--line);display:flex;align-items:center;
  justify-content:center;font-style:normal;font-size:20px;color:var(--txt)}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kb b{background:var(--kb);border-radius:7px;text-align:center;padding:13px 0;font-size:19px;font-weight:500;color:var(--kbt)}
.kb b:active{filter:brightness(.93)}
.kb b.fn{font-size:14px;color:var(--sub)}
.rowlist .r{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.rowlist .r:last-child{border-bottom:none}
.rowlist .r .sp{flex:1;color:var(--dim);font-size:12px}
.bankline{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;
  border-bottom:1px solid var(--line2);font-size:13.5px;color:var(--sub)}
.bankline b{color:var(--txt);font-weight:600}
.bankline b i{color:var(--dim);font-style:normal;margin-left:2px}
.toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(70,70,70,.95);color:#fff;
  padding:11px 18px;border-radius:8px;font-size:13.5px;z-index:99;opacity:0;transition:opacity .2s;
  pointer-events:none;max-width:80%;text-align:center}
.toast.on{opacity:1}
/* ---------- tabbar ---------- */
#tab{flex:0 0 auto;display:flex;background:var(--tab);border-top:1px solid var(--line2);
  padding-bottom:env(safe-area-inset-bottom,0px)}
#tab .it{flex:1;text-align:center;padding:6px 0 5px;color:var(--dim);font-size:10px}
#tab .it svg{display:block;margin:0 auto 2px;width:21px;height:21px}
#tab .it.on{color:var(--red)}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="back hide" data-act="back">‹</div>
    <div class="ttl">同花顺</div>
    <div class="search" data-act="pick"><span id="seTxt">搜代码 / 名称 / 简拼</span></div>
    <div class="ai">AI</div>
    <div class="btn" data-act="theme" id="thBtn">☾</div>
    <div class="btn" data-act="refresh">⟳</div>
  </div>
  <div id="view"></div>
  <div id="tab">
    <div class="it on" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 17l5-6 4 3 4-7 5 4"/><path d="M3 21h18"/></svg>行情</div>
    <div class="it" data-tab="watch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 17l-5.2 2.6 1-5.8L3.5 9.7l5.9-.9z"/></svg>自选</div>
    <div class="it" data-tab="trade"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>交易</div>
    <div class="it" data-tab="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.4"/></svg>资金</div>
    <div class="it" data-tab="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>资讯</div>
    <div class="it" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.3"/><path d="M5 20c1.4-3.6 4-5 7-5s5.6 1.4 7 5"/></svg>我的</div>
  </div>
</div>

    // 记录净值曲线（每天一条）
    var nav=netAsset();
    if(!S.curve.length||S.curve[S.curve.length-1].d!==d) S.curve.push({d:d,v:nav});
    save();
  }
}

function loadScript(src,charset){
  return new Promise(function(res,rej){
    var s=document.createElement('script'); s.src=src; if(charset) s.charset=charset;
    s.onload=function(){ s.remove(); res(); };
    s.onerror=function(){ s.remove(); rej(new Error('net')); };
    document.head.appendChild(s);
  });
}
function parseQ(code,raw){
  var a=String(raw).split('~'), n=function(i){ return parseFloat(a[i])||0; };
  var q={code:code,name:a[1]||'',price:n(3),pre:n(4),open:n(5),vol:n(6),high:n(33),low:n(34),
    amount:n(37),turn:n(38),pe:n(39),amp:n(43),fcap:n(44),tcap:n(45),pb:n(46),lup:n(47),ldn:n(48),
    vr:n(49),time:a[30]||'',bids:[],asks:[]};
  for(var i=0;i<5;i++){ q.bids.push({p:n(9+i*2),v:n(10+i*2)}); q.asks.push({p:n(19+i*2),v:n(20+i*2)}); }
  q.chg=q.price-q.pre; q.pct=q.pre?q.chg/q.pre*100:0;
  if(!q.lup&&q.pre) q.lup=Math.round(q.pre*1.1*100)/100;
  if(!q.ldn&&q.pre) q.ldn=Math.round(q.pre*0.9*100)/100;
  return q;
}
function fetchQuotes(codes){
  codes=codes.filter(function(c,i,a){return a.indexOf(c)===i});
  if(!codes.length) return Promise.resolve(Q);
  var chunks=[],i;
  for(i=0;i<codes.length;i+=40) chunks.push(codes.slice(i,i+40));
  var p=Promise.resolve();
  chunks.forEach(function(ch){
    p=p.then(function(){
      return loadScript('https://qt.gtimg.cn/q='+ch.join(',')+'&_='+Date.now(),'gbk').then(function(){
        ch.forEach(function(c){ var raw=window['v_'+c]; if(raw){ Q[c]=parseQ(c,raw); try{delete window['v_'+c]}catch(e){} } });
      });
    });
  });
  return p.then(function(){ return Q; });
}
function fetchMinute(code){
  var v='_m'+Math.floor(Math.random()*1e9);
  return loadScript('https://web.ifzq.gtimg.cn/appstock/app/minute/query?code='+code+'&_var='+v).then(function(){
    var d=window[v]; try{delete window[v]}catch(e){}
    var node=d&&d.data&&d.data[code]; var arr=node&&node.data&&node.data.data||[];
    var qt=node&&node.qt&&(node.qt[code]||node.qt)||null;
    var pre=qt?parseFloat(qt[4])||0:0;
    MIN[code]={arr:arr,pre:pre};
    return MIN[code];
  });
}
function fetchKline(code,period,count){
  var v='_k'+Math.floor(Math.random()*1e9);
  var p=(period==='week'?'week':(period==='month'?'month':'day'));
  return loadScript('https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param='+code+','+p+',,,'+(count||120)+',qfq&_var='+v).then(function(){
    var d=window[v]; try{delete window[v]}catch(e){}
    var node=d&&d.data&&d.data[code]||{};
    var arr=node['qfq'+p]||node[p]||[];
    KL[code+'|'+period]=arr;
    return arr;
  });
}

function priceOf(code){ return (Q[code]&&Q[code].price)||0; }
function mv(){ var t=0; for(var c in S.pos){ t+=S.pos[c].qty*priceOf(c); } return t; }

/* ============ 交易 ============ */
var FEE={comm:0.00025,commMin:5,stamp:0.0005,transfer:0.00001};
function feeBuy(amt){ var c=Math.max(FEE.commMin,amt*FEE.comm), t=amt*FEE.transfer; return {comm:c,stamp:0,transfer:t,total:c+t}; }
function feeSell(amt){ var c=Math.max(FEE.commMin,amt*FEE.comm), s=amt*FEE.stamp, t=amt*FEE.transfer; return {comm:c,stamp:s,transfer:t,total:c+s+t}; }

function isTradingTime(){
  var d=new Date(), w=d.getDay(); if(w===0||w===6) return false;
  var m=d.getHours()*60+d.getMinutes();
  return (m>=570&&m<=690)||(m>=780&&m<=900); // 9:30-11:30, 13:00-15:00
}
function placeOrder(code,side,price,qty,type){
  var q=Q[code]; if(!q){ toast('行情未加载'); return {ok:false,msg:'无行情'}; }
  if(!qty||qty<=0) return {ok:false,msg:'数量不对'};
  if(qty%100!==0) return {ok:false,msg:'数量须为100股整数倍'};
  var px = type==='market' ? q.price : price;
  if(!px||px<=0) return {ok:false,msg:'价格不对'};
  px=Math.round(px*100)/100;
  if(px>q.lup+0.001) return {ok:false,msg:'超出涨停价 '+q.lup.toFixed(2)};
  if(px<q.ldn-0.001) return {ok:false,msg:'低于跌停价 '+q.ldn.toFixed(2)};
  var amt=px*qty;
  if(side==='buy'){
    var f=feeBuy(amt), need=amt+f.total;
    if(need>S.cash) return {ok:false,msg:'可用资金不足，还差 '+money(need-S.cash)};
    S.cash-=need;
    var o={id:'B'+Date.now(),code:code,name:BY[code]?BY[code].name:(q.name||code),side:'buy',price:px,qty:qty,filled:0,ts:Date.now(),status:'pending'};
    S.orders.unshift(o);
    matchNow(o,q);
  }else{
    var p=S.pos[code];
    if(!p||p.avail<qty) return {ok:false,msg:'可卖数量不足（T+1）'};
    var o2={id:'S'+Date.now(),code:code,name:BY[code]?BY[code].name:(q.name||code),side:'sell',price:px,qty:qty,filled:0,ts:Date.now(),status:'pending'};
    p.avail-=qty; p.qty-=qty;
    S.orders.unshift(o2);
    matchNow(o2,q);
  }
  save(); return {ok:true};
}
function matchNow(o,q){
  if(!S.demoMatch && !isTradingTime()) return;  // 非交易时段只挂单，开盘后再撮合
  var fillPrice=0;
  if(o.side==='buy'){
    if(q.asks[0]&&q.asks[0].p>0&&o.price>=q.asks[0].p) fillPrice=q.asks[0].p;
  }else{
    if(q.bids[0]&&q.bids[0].p>0&&o.price<=q.bids[0].p) fillPrice=q.bids[0].p;
  }
  if(fillPrice>0){ fill(o,fillPrice,q); }
}
function fill(o,price,q){
  var amt=price*o.qty;
  if(o.side==='buy'){
    var f=feeBuy(amt), need=amt+f.total;
    // 已按委托价扣款，退回差价
    var refund=(o.price-price)*o.qty;
    S.cash+=refund;
    var p=S.pos[o.code]||(S.pos[o.code]={qty:0,avail:0,cost:0});
    var oldCost=p.cost*p.qty;
    p.qty+=o.qty; p.cost=(oldCost+need)/p.qty;
    S.flow.push({t:Date.now(),type:'买入',txt:o.name+' '+o.qty+'股 @'+price.toFixed(2),amt:-(amt+f.total)});
  }else{
    var f2=feeSell(amt), get=amt-f2.total;
    S.cash+=get;
    var p2=S.pos[o.code]; if(p2&&p2.qty<=0) delete S.pos[o.code];
    S.flow.push({t:Date.now(),type:'卖出',txt:o.name+' '+o.qty+'股 @'+price.toFixed(2),amt:get});
  }
  o.status='done'; o.filled=o.qty; o.fillPrice=price;
  S.trades.unshift({id:o.id,code:o.code,name:o.name,side:o.side,price:price,qty:o.qty,amt:amt,ts:Date.now(),
    fee:(o.side==='buy'?feeBuy(amt).total:feeSell(amt).total)});
  if(S.trades.length>200) S.trades.length=200;
}
function cancelOrder(id){
  var o=null,i; for(i=0;i<S.orders.length;i++){ if(S.orders[i].id===id) o=S.orders[i]; }
  if(!o||o.status!=='pending') return;
  if(o.side==='buy'){ S.cash+=o.price*o.qty*(1+FEE.comm+FEE.transfer); }
  else { var p=S.pos[o.code]||(S.pos[o.code]={qty:0,avail:0,cost:0}); p.qty+=o.qty; p.avail+=o.qty; }
  o.status='cancel';
  save(); render(); toast('已撤单');
}
function checkOrders(){
  var open=S.orders.filter(function(o){return o.status==='pending'});
  if(!open.length) return;
  open.forEach(function(o){ var q=Q[o.code]; if(q) matchNow(o,q); });
  save();
}

/* ============ 画图 ============ */
function hiDPI(cv){
  var r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  var w=Math.max(1,Math.floor(r.width)), h=Math.max(1,Math.floor(r.height));
  cv.width=w*dpr; cv.height=h*dpr;
  var g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  return {g:g,w:w,h:h};
}
function drawMinute(cv,code){
  var d=MIN[code]; if(!d||!d.arr.length) return;
  var pts=d.arr.map(function(s){ var a=s.split(' '); return {t:a[0],p:parseFloat(a[1]),v:parseFloat(a[2])||0}; })
                 .filter(function(x){return x.p>0});
  if(!pts.length) return;
  var pre=d.pre||(Q[code]?Q[code].pre:pts[0].p);
  var {g,w,h}=hiDPI(cv);
  var padL=44,padR=116,padT=24,ph=h*0.58,vh=h*0.21;
  var showN=241;
  var hi=pre,lo=pre;
  pts.forEach(function(x){ hi=Math.max(hi,x.p); lo=Math.min(lo,x.p); });
  var dev=Math.max(hi-pre,pre-lo)||pre*0.01;
  dev=dev*1.06;
  hi=pre+dev; lo=pre-dev;
  var X=function(i){ return padL+(w-padL-padR)*(i/(showN-1)); };
  var Y=function(p){ return padT+ph*(hi-p)/(hi-lo||1); };
  g.clearRect(0,0,w,h);
  g.font='9px -apple-system'; g.lineWidth=1;
  // 横网格 + 左侧价格刻度
  for(var i=0;i<=4;i++){
    var y=padT+ph*i/4, pv=hi-(hi-lo)*i/4, pc=(pv/pre-1)*100;
    g.strokeStyle=TH.grid; g.beginPath(); g.moveTo(padL,y); g.lineTo(w-padR,y); g.stroke();
    g.textAlign='right'; g.fillStyle=Math.abs(pc)<0.0001?TH.txt:(pc>0?TH.up:TH.dn);
    g.fillText(pv.toFixed(2), padL-4, y+3);
  }
  // 竖网格
  for(var j=0;j<=2;j++){ var x=padL+(w-padL-padR)*j/2; g.strokeStyle=TH.grid;
    g.beginPath(); g.moveTo(x,padT); g.lineTo(x,padT+ph); g.stroke(); }
  // 昨收虚线
  g.strokeStyle=TH.pre; g.setLineDash([3,3]); g.beginPath();
  g.moveTo(padL,Y(pre)); g.lineTo(w-padR,Y(pre)); g.stroke(); g.setLineDash([]);
  g.fillStyle=TH.txt; g.textAlign='left'; g.fillText('0.00%', padL+2, Y(pre)-4);
  // 涨跌幅标记（上 / 下）
  var pctUp=(hi/pre-1)*100, pctDn=(lo/pre-1)*100;
  g.fillStyle=TH.up; g.fillText('+'+pctUp.toFixed(2)+'%', padL+2, padT+9);
  g.fillStyle=TH.dn; g.fillText(pctDn.toFixed(2)+'%', padL+2, padT+ph-2);
  // 价格线
  var last=pts[pts.length-1].p, up=last>=pre;
  g.strokeStyle=up?TH.up:TH.dn; g.lineWidth=1.2; g.beginPath();
  pts.forEach(function(x,i){ var xx=X(i),yy=Y(x.p); i?g.lineTo(xx,yy):g.moveTo(xx,yy); }); g.stroke();
  // 均价线
  var color='#f5a623';
  g.strokeStyle=color; g.lineWidth=1; g.beginPath();
  var sum=0;
  pts.forEach(function(x,i){ sum+=x.p; var yy=Y(sum/(i+1)); var xx=X(i); i?g.lineTo(xx,yy):g.moveTo(xx,yy); });
  g.stroke();
  // 顶部数据行
  var avg=sum/pts.length;
  g.font='9px -apple-system'; g.textAlign='left';
  g.fillStyle=color; g.fillText('均价 '+avg.toFixed(2), padL+2, 11);
  g.fillStyle=up?TH.up:TH.dn;
  g.fillText('最新 '+last.toFixed(2)+'　'+((last-pre)/pre*100>=0?'+':'')+((last-pre)/pre*100).toFixed(2)+'%', padL+66, 11);
  // 成交量
  var vmax=1; pts.forEach(function(x){ if(x.v>vmax) vmax=x.v; });
  var vBase=h-13, vTop=padT+ph+8, vSpace=vBase-vTop;
  g.strokeStyle=TH.grid; g.beginPath(); g.moveTo(padL,vTop-4); g.lineTo(w-padR,vTop-4); g.stroke();
  pts.forEach(function(x,i){ var hh=vSpace*Math.max(0.02,x.v/vmax); var xx=X(i);
    g.fillStyle=up?TH.volUp:TH.volDn;
    g.fillRect(xx-0.8, vBase-hh, 1.6, hh); });
  // 时间轴
  g.fillStyle=TH.txt; g.textAlign='left'; g.font='9px -apple-system';
  g.fillText('09:30', padL, h-1);
  g.textAlign='center'; g.fillText('11:30', padL+(w-padL-padR)/2, h-1);
  g.textAlign='right'; g.fillText('15:00', w-padR, h-1);
}
function drawKline(cv,code,period){
  var arr=KL[code+'|'+period]; if(!arr||!arr.length) return;
  var data=arr.slice(-90).map(function(r){ return {d:r[0],o:+r[1],c:+r[2],h:+r[3],l:+r[4],v:+(r[5]||0)}; });
  var {g,w,h}=hiDPI(cv);
  var padL=6,padR=40,padT=8,ph=h*0.74,vh=h*0.22;
  var hi=Math.max.apply(null,data.map(function(x){return x.h})), lo=Math.min.apply(null,data.map(function(x){return x.l}));
  var n=data.length, bw=(w-padL-padR)/n*0.62;
  var X=function(i){ return padL+(w-padL-padR)*(i+0.5)/n; };
  var Y=function(p){ return padT+ph*(hi-p)/(hi-lo||1); };
  g.clearRect(0,0,w,h);
  g.strokeStyle=TH.grid;
  for(var i=0;i<=4;i++){ var y=padT+ph*i/4; g.beginPath(); g.moveTo(0,y); g.lineTo(w-padR,y); g.stroke(); }
  data.forEach(function(x,i){
    var up=x.c>=x.o, col=up?TH.up:TH.dn;
    g.strokeStyle=col; g.fillStyle=col; g.lineWidth=1;
    var cx=X(i);
    g.beginPath(); g.moveTo(cx, Y(x.h)); g.lineTo(cx, Y(x.l)); g.stroke();
    var y1=Y(Math.max(x.o,x.c)), y2=Y(Math.min(x.o,x.c));
    if(up) g.fillRect(cx-bw/2, y1, bw, Math.max(1,y2-y1));
    else { g.fillRect(cx-bw/2, y1, bw, Math.max(1,y2-y1)); }
  });
  // MA5
  function ma(n2){
    var out=[]; for(var i=0;i<data.length;i++){ if(i<n2-1){out.push(null);continue;} var s=0; for(var k=i-n2+1;k<=i;k++) s+=data[k].c; out.push(s/n2); }
    return out;
  }
  [[5,'#f5a623'],[10,'#2f80ed']].forEach(function(m){
    var line=ma(m[0]); g.strokeStyle=m[1]; g.lineWidth=1; g.beginPath(); var started=false;
    line.forEach(function(v,i){ if(v==null) return; var xx=X(i),yy=Y(v); if(!started){g.moveTo(xx,yy);started=true} else g.lineTo(xx,yy); });
    g.stroke();
  });
  // volume
  var vmax=Math.max.apply(null,data.map(function(x){return x.v}))||1;
  data.forEach(function(x,i){ var hh=vh*(x.v/vmax); g.fillStyle=(x.c>=x.o?TH.volUp:TH.volDn);
    g.fillRect(X(i)-bw/2, h-hh-2, bw, hh); });
  g.font='9px -apple-system'; g.fillStyle=TH.txt; g.textAlign='left';
  g.fillText(hi.toFixed(2), w-padR+4, padT+8);
  g.fillText(lo.toFixed(2), w-padR+4, padT+ph);
}

function maxBuy(c){

  return Math.max(0,n);
}
function principal(){
  var p=0; S.flow.forEach(function(f){ if(f.type==='入账') p+=f.amt; if(f.type==='出账') p+=f.amt; });

}
function drawCurve(){
  var cv=document.getElementById('curve'); if(!cv) return;
  var d=S.curve.slice(-30);
  var {g,w,h}=hiDPI(cv);
  g.clearRect(0,0,w,h);
  if(d.length<2){ g.fillStyle=TH.txt; g.font='12px -apple-system'; g.textAlign='center';
    g.fillText('攒够两天就有了', w/2, h/2); return; }
  var vs=d.map(function(x){return x.v});
  var hi=Math.max.apply(null,vs), lo=Math.min.apply(null,vs);
  var X=function(i){ return 8+(w-16)*i/(d.length-1); };
  var Y=function(v){ return 10+(h-24)*(hi-v)/((hi-lo)||1); };
  g.strokeStyle=TH.grid; g.lineWidth=1;
  for(var i=0;i<=3;i++){ var y=10+(h-24)*i/3; g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
  g.strokeStyle=TH.up; g.lineWidth=1.6; g.beginPath();
  d.forEach(function(x,i){ var xx=X(i),yy=Y(x.v); i?g.lineTo(xx,yy):g.moveTo(xx,yy); }); g.stroke();
  g.fillStyle='#6b7075'; g.font='9px -apple-system'; g.textAlign='left';
  g.fillText(fmt(hi,0), 2, 12); g.fillText(fmt(lo,0), 2, h-14);
}

function kbHtml(withDot){
  return ['1','2','3','4','5','6','7','8','9',(withDot?'.':'000'),'0','del'].map(function(k){
    if(k==='del') return '<b class="fn" data-k="del">删除</b>';
    if(k==='000') return '<b class="fn" data-k="000">000</b>';
    return '<b data-k="'+k+'">'+k+'</b>';
  }).join('');
}
function bindTransfer(){
  var kb=document.getElementById('kb')||document.getElementById('kb2');
  document.querySelectorAll('.sheet [data-bank]').forEach(function(el){
    el.onclick=function(){ TV.bank=el.dataset.bank; TV.picking=false; transferSheet(); };
  });
  var pick=document.querySelector('.sheet [data-pick]');
  if(pick) pick.onclick=function(){ TV.picking=true; transferSheet(); };
  var fin=document.querySelector('.sheet [data-closex]');
  if(fin) fin.onclick=function(){ closeSheet(); render(); };
  if(!kb) return;
  kb.addEventListener('click',function(e){
    var b=e.target.closest('[data-k]'); if(!b) return;
    var k=b.dataset.k;
    if(TV.step===0){
      if(k==='del') TV.pwd=TV.pwd.slice(0,-1);
      else if(/^\d$/.test(k)&&TV.pwd.length<6) TV.pwd+=k;
      document.getElementById('dots').innerHTML=dots(TV.pwd.length);
      if(TV.pwd.length===6){ S.pwd=TV.pwd; save(); TV.pwd=''; TV.step=1; setTimeout(transferSheet,180); }
    }else if(TV.step===1){
      if(k==='del') TV.amt=Math.floor(TV.amt*100)/1000;
      else if(k==='000') TV.amt=Math.min(TV.amt*1000,99999999);
      else if(k==='.') { }
      else TV.amt=Math.min(TV.amt*10+parseInt(k),99999999);
      TV.amt=Math.round(TV.amt*100)/100;
      document.getElementById('amt').innerHTML='<small>¥</small>'+fmt(TV.amt,2);
    }else if(TV.step===2){
      if(k==='del') TV.pwd=TV.pwd.slice(0,-1);
      else if(/^\d$/.test(k)&&TV.pwd.length<6) TV.pwd+=k;
      document.getElementById('dots').innerHTML=dots(TV.pwd.length);
      if(TV.pwd.length===6){
        if(TV.pwd!==S.pwd){ toast('密码错误'); TV.pwd=''; document.getElementById('dots').innerHTML=dots(0); return; }
        doTransfer();
      }
    }
  });
  var nextBtn=document.querySelector('.sheet [data-next]');
  if(nextBtn) nextBtn.onclick=function(){
    if(!TV.amt||TV.amt<=0) return toast('先输入金额');
    if(TV.dir==='in'&&TV.amt>S.bank) return toast('银行卡余额不足');
    if(TV.dir==='out'&&TV.amt>S.cash) return toast('可用资金不足');
    TV.step=2; TV.pwd=''; transferSheet();
  };
}
function doTransfer(){
  if(TV.amt<=0) return toast('金额要大于 0');
  if(TV.dir==='in'&&TV.amt>S.bank) return toast('银行卡余额不足');
  if(TV.dir==='out'&&TV.amt>S.cash) return toast('可用资金不足');
  TV.step=3; transferSheet();
  setTimeout(function(){
    if(TV.dir==='in'){ S.bank-=TV.amt; S.cash+=TV.amt; S.flow.push({t:Date.now(),type:'入账',txt:'银证转账 · 银行→证券',amt:TV.amt}); }
    else { S.bank+=TV.amt; S.cash-=TV.amt; S.flow.push({t:Date.now(),type:'出账',txt:'银证转账 · 证券→银行',amt:-TV.amt}); }
    save(); TV.step=4; transferSheet(); render();
  },1200);
}

/* ============ 刷新循环 ============ */
function refreshForView(){
  var codes=[];
  if(ui.page==='stock'&&ui.stock) codes=[ui.stock].concat(INDICES.map(function(i){return i[0]}));
  else if(ui.tab==='home') codes=POOL.slice(0,60).map(function(a){return a[0]}).concat(INDICES.map(function(i){return i[0]}));
  else if(ui.tab==='watch') codes=S.watch.concat(INDICES.map(function(i){return i[0]}));
  else if(ui.tab==='trade') codes=(ui.tradeCode?[ui.tradeCode]:[]).concat(Object.keys(S.pos)).concat(S.watch);
  else codes=Object.keys(S.pos).concat(S.watch).concat(POOL.slice(0,40).map(function(a){return a[0]}))
    .concat(INDICES.map(function(i){return i[0]}));
  return fetchQuotes(codes);
}
function doRefresh(manual){
  refreshForView().then(function(){
    checkOrders();
    render();
    if(manual) toast('已刷新');
  }).catch(function(){ if(manual) toast('网络不太好，再试一次'); });
}
function render(){
  var ae=document.activeElement;
  if(ae&&/^in-/.test(ae.id||'')) return;   // 正在输单，别打断
  view();
  if(ui.tab==='trade') est();
}

/* hash 直达（方便分享/调试，支持前后退） */
function routeHash(){
  var h=(location.hash||'').replace('#','');
  if(!h) return false;
  if(h.indexOf('stock/')===0){ ui.page='stock'; ui.stock=h.slice(6); }
  else if(['home','watch','trade','money','news','me'].indexOf(h)>=0){ ui.tab=h; ui.page='list'; }
  else return false;
  document.querySelectorAll('#tab .it').forEach(function(x){x.classList.toggle('on',x.dataset.tab===ui.tab)});
  render();
  return true;
}
routeHash();
window.addEventListener('hashchange',routeHash);

applyTheme((function(){ try{ return localStorage.getItem('thsTheme')||'dark'; }catch(e){ return 'dark'; } })(), true);
settle();
render();
doRefresh(false);
tick=setInterval(function(){ doRefresh(false); },3000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) doRefresh(false); });
</script>
